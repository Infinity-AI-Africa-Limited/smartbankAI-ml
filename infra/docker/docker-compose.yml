# ─────────────────────────────────────────────────────────────────────────────
# SmartBank AI — Full ML Stack (LOCAL DEVELOPMENT ONLY)
#
# Not a staging topology. Synthetic artefacts only; never real bank data.
# Usage: docker compose -f infra/docker/docker-compose.yml up --build
# ─────────────────────────────────────────────────────────────────────────────

x-common-env: &common-env
  ENVIRONMENT: ${ENVIRONMENT:-development}
  SERVICE_AUTH_TOKEN: ${SERVICE_AUTH_TOKEN:?set SERVICE_AUTH_TOKEN (min 32 chars) before starting}
  DATABASE_URL: ${DATABASE_URL:-}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}

x-common-healthcheck: &common-healthcheck
  interval: 30s
  timeout: 10s
  retries: 3
  start_period: 20s

networks:
  smartbank-ml:
    driver: bridge


services:

  # ── Base image builder (not a running service) ──────────────────────────────
  base-builder:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.base
    image: smartbank-ai-base:latest
    command: echo "Base image built"

  # ── Agent Orchestrator ──────────────────────────────────────────────────────
  orchestrator:
    build:
      context: ../..
      dockerfile: orchestrator/Dockerfile
    image: smartbank-ai-orchestrator:latest
    container_name: smartbank-orchestrator
    ports:
      - "8001:8001"
    environment:
      <<: *common-env
      AGENT_NAME: orchestrator
    networks:
      - smartbank-ml
    depends_on:
      fraud-detection:
        condition: service_healthy
      credit-risk:
        condition: service_healthy
      aml-compliance:
        condition: service_healthy
      personalization:
        condition: service_healthy
      predictive-analytics:
        condition: service_healthy
      conversational-ai:
        condition: service_healthy
      smart-dashboard:
        condition: service_healthy
      data-aggregation:
        condition: service_healthy
    healthcheck:
      <<: *common-healthcheck
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
    restart: unless-stopped

  # ── Agent 1: Fraud Detection ────────────────────────────────────────────────
  fraud-detection:
    build:
      context: ../..
      dockerfile: agents/fraud_detection/Dockerfile
    image: smartbank-ai-fraud-detection:latest
    container_name: smartbank-fraud-detection
    environment:
      <<: *common-env
      AGENT_NAME: fraud_detection
      MODEL_DIR: /app/models
    volumes:
      - ../../agents/fraud_detection/models:/app/models:ro
    networks:
      - smartbank-ml
    healthcheck:
      <<: *common-healthcheck
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
    restart: unless-stopped

  # ── Agent 2: Credit Risk ────────────────────────────────────────────────────
  credit-risk:
    build:
      context: ../..
      dockerfile: agents/credit_risk/Dockerfile
    image: smartbank-ai-credit-risk:latest
    container_name: smartbank-credit-risk
    environment:
      <<: *common-env
      AGENT_NAME: credit_risk
      MODEL_DIR: /app/models
    volumes:
      - ../../agents/credit_risk/models:/app/models:ro
    networks:
      - smartbank-ml
    healthcheck:
      <<: *common-healthcheck
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
    restart: unless-stopped

  # ── Agent 3: AML Compliance ─────────────────────────────────────────────────
  aml-compliance:
    build:
      context: ../..
      dockerfile: agents/aml_compliance/Dockerfile
    image: smartbank-ai-aml-compliance:latest
    container_name: smartbank-aml-compliance
    environment:
      <<: *common-env
      AGENT_NAME: aml_compliance
      MODEL_DIR: /app/models
    volumes:
      - ../../agents/aml_compliance/models:/app/models:ro
    networks:
      - smartbank-ml
    healthcheck:
      <<: *common-healthcheck
      test: ["CMD", "curl", "-f", "http://localhost:8004/health"]
    restart: unless-stopped

  # ── Agent 4: Personalization ────────────────────────────────────────────────
  personalization:
    build:
      context: ../..
      dockerfile: agents/personalization/Dockerfile
    image: smartbank-ai-personalization:latest
    container_name: smartbank-personalization
    environment:
      <<: *common-env
      AGENT_NAME: personalization
      MODEL_DIR: /app/models
    volumes:
      - ../../agents/personalization/models:/app/models:ro
    networks:
      - smartbank-ml
    healthcheck:
      <<: *common-healthcheck
      test: ["CMD", "curl", "-f", "http://localhost:8005/health"]
    restart: unless-stopped

  # ── Agent 5: Predictive Analytics ──────────────────────────────────────────
  predictive-analytics:
    build:
      context: ../..
      dockerfile: agents/predictive_analytics/Dockerfile
    image: smartbank-ai-predictive-analytics:latest
    container_name: smartbank-predictive-analytics
    environment:
      <<: *common-env
      AGENT_NAME: predictive_analytics
      MODEL_DIR: /app/models
    volumes:
      - ../../agents/predictive_analytics/models:/app/models:ro
    networks:
      - smartbank-ml
    healthcheck:
      <<: *common-healthcheck
      test: ["CMD", "curl", "-f", "http://localhost:8006/health"]
    restart: unless-stopped

  # ── Agent 6: Conversational AI ──────────────────────────────────────────────
  conversational-ai:
    build:
      context: ../..
      dockerfile: agents/conversational_ai/Dockerfile
    image: smartbank-ai-conversational-ai:latest
    container_name: smartbank-conversational-ai
    environment:
      <<: *common-env
      AGENT_NAME: conversational_ai
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-claude-3-5-sonnet-20241022}
      SMARTBANK_ENABLE_REMOTE_RAG: ${SMARTBANK_ENABLE_REMOTE_RAG:-false}
      MODEL_DIR: /app/models
    volumes:
      - ../../agents/conversational_ai/models:/app/models:ro
    networks:
      - smartbank-ml
    healthcheck:
      <<: *common-healthcheck
      test: ["CMD", "curl", "-f", "http://localhost:8007/health"]
    restart: unless-stopped

  # ── Agent 7: Smart Dashboard ────────────────────────────────────────────────
  smart-dashboard:
    build:
      context: ../..
      dockerfile: agents/smart_dashboard/Dockerfile
    image: smartbank-ai-smart-dashboard:latest
    container_name: smartbank-smart-dashboard
    environment:
      <<: *common-env
      AGENT_NAME: smart_dashboard
      MODEL_DIR: /app/models
    volumes:
      - ../../agents/smart_dashboard/models:/app/models:ro
    networks:
      - smartbank-ml
    healthcheck:
      <<: *common-healthcheck
      test: ["CMD", "curl", "-f", "http://localhost:8008/health"]
    restart: unless-stopped

  # ── Agent 8: Data Aggregation ───────────────────────────────────────────────
  data-aggregation:
    build:
      context: ../..
      dockerfile: agents/data_aggregation/Dockerfile
    image: smartbank-ai-data-aggregation:latest
    container_name: smartbank-data-aggregation
    environment:
      <<: *common-env
      AGENT_NAME: data_aggregation
      MODEL_DIR: /app/models
    volumes:
      - ../../agents/data_aggregation/models:/app/models:ro
    networks:
      - smartbank-ml
    healthcheck:
      <<: *common-healthcheck
      test: ["CMD", "curl", "-f", "http://localhost:8009/health"]
    restart: unless-stopped

