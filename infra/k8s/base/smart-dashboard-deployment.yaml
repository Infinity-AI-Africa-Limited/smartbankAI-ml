apiVersion: apps/v1
kind: Deployment
metadata:
  name: smart-dashboard
  labels:
    app: smart-dashboard
    project: smartbankAI
spec:
  replicas: 2
  selector:
    matchLabels:
      app: smart-dashboard
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: smart-dashboard
        version: "1.0.0"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: smart-dashboard
          image: ghcr.io/infinityai-africa/smartbankAI-smart-dashboard:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8008
              protocol: TCP
          envFrom:
            - configMapRef:
                name: smartbank-config
            - secretRef:
                name: smartbank-secrets
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "256Mi"
              cpu: "250m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8008
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8008
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - name: models
              mountPath: /app/models
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: models-pvc-smart-dashboard
      restartPolicy: Always
