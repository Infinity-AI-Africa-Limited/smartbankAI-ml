# SmartBank AI — Model artefact volumes
#
# Every deployment mounts one of these. They were referenced but never defined,
# so `kubectl apply -k` left every pod Pending.
#
# ReadOnlyMany: artefacts are published by the release pipeline, never written
# by a running service. Set `storageClassName` in the environment overlay.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: models-pvc-orchestrator
  labels:
    app: orchestrator
spec:
  accessModes: [ReadOnlyMany]
  resources:
    requests:
      storage: 2Gi
---
