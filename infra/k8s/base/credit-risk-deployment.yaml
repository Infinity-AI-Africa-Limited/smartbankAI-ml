apiVersion: apps/v1
kind: Deployment
metadata:
  name: credit-risk
  labels:
    app: credit-risk
    project: smartbankAI
spec:
  replicas: 2
  selector:
    matchLabels:
      app: credit-risk
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: credit-risk
        version: "1.0.0"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: credit-risk
          image: ghcr.io/infinityai-africa/smartbankAI-credit-risk:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8003
              protocol: TCP
          envFrom:
            - configMapRef:
                name: smartbank-config
            - secretRef:
                name: smartbank-secrets
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8003
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8003
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - name: models
              mountPath: /app/models
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: models-pvc-credit-risk
      restartPolicy: Always
