apiVersion: apps/v1
kind: Deployment
metadata:
  name: conversational-ai
  labels:
    app: conversational-ai
    project: smartbankAI
spec:
  replicas: 2
  selector:
    matchLabels:
      app: conversational-ai
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: conversational-ai
        version: "1.0.0"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: conversational-ai
          image: ghcr.io/infinityai-africa/smartbankAI-conversational-ai:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8007
              protocol: TCP
          envFrom:
            - configMapRef:
                name: smartbank-config
            - secretRef:
                name: smartbank-secrets
          resources:
            requests:
              memory: "1Gi"
              cpu: "1000m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8007
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8007
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - name: models
              mountPath: /app/models
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: models-pvc-conversational-ai
      restartPolicy: Always
