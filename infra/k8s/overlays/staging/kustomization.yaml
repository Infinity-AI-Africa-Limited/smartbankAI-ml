apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: smartbank-staging

resources:
  - ../../base

patches:
  - path: replicas-patch.yaml

configMapGenerator:
  - name: smartbank-config
    behavior: merge
    literals:
      - ENVIRONMENT=staging
      - LOG_LEVEL=DEBUG

# Image tags are set by the deploy job:
#   kustomize edit set image <name>=<registry>/<image>:<commit-sha>
# PINNED-BY-OVERLAY is not a resolvable tag, so an unpinned deploy fails
# at pull time rather than silently shipping whatever :latest points at.
