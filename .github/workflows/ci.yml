name: SmartBank AI — Build, Test & Deploy

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_environment:
        description: "Environment to promote after successful integration tests"
        required: true
        type: choice
        options: [staging, production]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/smartbankAI

jobs:
  # ── 1. Lint & Unit Tests ────────────────────────────────────────────────────
  test:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install test dependencies
        run: |
          pip install pytest pytest-asyncio httpx pydantic pydantic-settings fastapi uvicorn

      - name: Run unit tests
        run: pytest tests/unit/ -v --tb=short

      - name: Verify versioned API contract
        run: |
          test -f contracts/ml-orchestrator.v1.openapi.yaml
          grep -F "version: 2026-08-01" contracts/ml-orchestrator.v1.openapi.yaml
          grep -F "/v1/route" contracts/ml-orchestrator.v1.openapi.yaml

      - name: Lint with ruff
        run: |
          pip install ruff
          ruff check agents/ orchestrator/ shared/ tests/

  # ── 2. Build & Push Docker Images ──────────────────────────────────────────
  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service:
          - name: base
            dockerfile: infra/docker/Dockerfile.base
            tag: smartbankAI-base
          - name: orchestrator
            dockerfile: orchestrator/Dockerfile
            tag: smartbankAI-orchestrator
          - name: fraud-detection
            dockerfile: agents/fraud_detection/Dockerfile
            tag: smartbankAI-fraud-detection
          - name: credit-risk
            dockerfile: agents/credit_risk/Dockerfile
            tag: smartbankAI-credit-risk
          - name: aml-compliance
            dockerfile: agents/aml_compliance/Dockerfile
            tag: smartbankAI-aml-compliance
          - name: personalization
            dockerfile: agents/personalization/Dockerfile
            tag: smartbankAI-personalization
          - name: predictive-analytics
            dockerfile: agents/predictive_analytics/Dockerfile
            tag: smartbankAI-predictive-analytics
          - name: conversational-ai
            dockerfile: agents/conversational_ai/Dockerfile
            tag: smartbankAI-conversational-ai
          - name: smart-dashboard
            dockerfile: agents/smart_dashboard/Dockerfile
            tag: smartbankAI-smart-dashboard
          - name: data-aggregation
            dockerfile: agents/data_aggregation/Dockerfile
            tag: smartbankAI-data-aggregation

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service.name }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.service.dockerfile }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── 3. Integration Tests ────────────────────────────────────────────────────
  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Start services
        run: |
          docker compose -f infra/docker/docker-compose.yml up -d
          sleep 30

      - name: Run health checks
        run: ./scripts/health_check.sh

      - name: Run integration tests
        run: |
          pip install pytest pytest-asyncio httpx
          pytest tests/integration/ -v --tb=short

      - name: Tear down
        if: always()
        run: docker compose -f infra/docker/docker-compose.yml down -v

  # ── 4. Deploy to Staging ────────────────────────────────────────────────────
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: integration-test
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_environment == 'staging'
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Configure kubectl
        uses: azure/k8s-set-context@v3
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBE_CONFIG_STAGING }}

      - name: Deploy to staging
        run: kubectl apply -k infra/k8s/overlays/staging

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/orchestrator -n smartbank-staging --timeout=5m
          kubectl rollout status deployment/fraud-detection -n smartbank-staging --timeout=5m

  # ── 5. Deploy to Production ─────────────────────────────────────────────────
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: integration-test
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_environment == 'production'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Configure kubectl
        uses: azure/k8s-set-context@v3
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBE_CONFIG_PRODUCTION }}

      - name: Deploy to production
        run: kubectl apply -k infra/k8s/overlays/production

      - name: Wait for rollout
        run: |
          for svc in orchestrator fraud-detection credit-risk aml-compliance personalization predictive-analytics conversational-ai smart-dashboard data-aggregation; do
            kubectl rollout status deployment/$svc -n smartbank-production --timeout=10m
          done

      - name: Notify on success
        if: success()
        run: echo "Production deployment successful — SmartBank AI ML stack v${{ github.sha }}"
