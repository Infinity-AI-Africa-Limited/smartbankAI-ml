name: SmartBank AI — Build, Test & Deploy

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_environment:
        description: "Environment to promote after a successful build"
        required: true
        type: choice
        options: [staging, production]

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/smartbank-ai
  BASE_IMAGE: smartbank-ai-base:latest

jobs:
  # ── 1. Lint, audit & unit tests ─────────────────────────────────────────────
  test:
    name: Lint, Audit & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip

      # Install the pinned runtime manifests, not floating latest versions, so
      # the tests exercise the same resolution the images ship.
      - name: Install pinned runtime dependencies
        run: |
          pip install -r infra/docker/requirements.base.txt
          for req in agents/*/requirements.txt orchestrator/requirements.txt; do
            pip install -r "$req"
          done

      - name: Install test tooling
        run: pip install pytest pytest-asyncio ruff pip-audit pyyaml

      # Restored gate: PR #2 added this and the later branch dropped it.
      - name: Audit dependency manifests
        run: ./scripts/audit_dependencies.sh

      - name: Lint with ruff
        run: ruff check agents orchestrator shared scripts tests

      - name: Byte-compile every module
        run: python -m compileall -q agents orchestrator shared

      # The artefact tests load real serialised models, so the synthetic build
      # runs first. Artefacts are development-only and never leave the runner.
      - name: Build synthetic development artefacts
        run: |
          chmod +x scripts/build_synthetic_models.sh
          ./scripts/build_synthetic_models.sh

      - name: Validate synthetic data quality
        run: python scripts/validate_synthetic_data.py

      # The Compose stack itself only runs in the live job, which is skipped on
      # pull requests. This check is static, so a malformed stack definition is
      # caught before merge rather than after.
      - name: Validate Compose structure
        run: python scripts/validate_compose_models.py

      - name: Run unit tests
        run: pytest tests/unit -q

      # Cross-service contract tests. Both rounds of P0 defects were orchestrator
      # /agent payload mismatches, which unit tests cannot see because each side
      # is individually correct. These run in-process, so they gate pull requests
      # - the compose-based job below is skipped on pull_request and cannot.
      - name: Run integration contract tests
        env:
          SERVICE_AUTH_TOKEN: ci-integration-token-not-a-real-secret
        run: pytest tests/integration -q -m "not live"

      - name: Verify versioned API contract
        run: |
          test -f contracts/ml-orchestrator.v1.openapi.yaml
          grep -F "version: 2026-08-01" contracts/ml-orchestrator.v1.openapi.yaml
          grep -F "/v1/route" contracts/ml-orchestrator.v1.openapi.yaml

      # The advisory posture is a merge gate, not a convention.
      - name: Assert no unauthenticated orchestrator route
        run: |
          if grep -nE '^@app\.(get|post)\(' orchestrator/main.py | grep -v '/health' > /tmp/routes.txt; then
            while read -r line; do
              lineno="${line%%:*}"
              sed -n "${lineno}p" orchestrator/main.py | grep -q 'Depends(verify_platform_request)' \
                || { echo "Unauthenticated orchestrator route at line ${lineno}"; exit 1; }
            done < /tmp/routes.txt
          fi

      - name: Assert the retrieval stack stays removed
        run: |
          ! grep -rniE 'langchain|chromadb|sentence-transformers|HuggingFaceEmbeddings' \
            agents/*/requirements.txt agents/*/main.py

  # ── 2. Build images ─────────────────────────────────────────────────────────
  # Single job: every agent image inherits FROM the base, so the base must exist
  # in the same Docker context. A parallel matrix cannot satisfy that.
  build:
    name: Build Images
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build base image
        run: docker build -f infra/docker/Dockerfile.base -t "$BASE_IMAGE" .

      - name: Build service images
        run: |
          set -euo pipefail
          build() { docker build -f "$1" -t "${REGISTRY}/${IMAGE_PREFIX}-$2:${GITHUB_SHA}" . ; }
          build orchestrator/Dockerfile orchestrator
          for dir in agents/*/; do
            name="$(basename "$dir" | tr '_' '-')"
            build "${dir}Dockerfile" "$name"
          done

      - name: Scan images for vulnerabilities
        uses: aquasecurity/trivy-action@915b19bbe73b92a6cf82a1bc12b087c9a19a5fe2 # v0.28.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-orchestrator:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-orchestrator:${{ github.sha }}
          format: spdx-json
          artifact-name: sbom-orchestrator.spdx.json

      # Images are pushed under the commit SHA only. No ":latest" on main: a
      # floating tag makes every merge a silent production redeploy and leaves
      # nothing specific to roll back to.
      - name: Push images
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          docker push "${REGISTRY}/${IMAGE_PREFIX}-orchestrator:${GITHUB_SHA}"
          for dir in agents/*/; do
            name="$(basename "$dir" | tr '_' '-')"
            docker push "${REGISTRY}/${IMAGE_PREFIX}-${name}:${GITHUB_SHA}"
          done

  # ── 3. Live stack ───────────────────────────────────────────────────────────
  # Real sockets, real container networking, real startup. Also produces the
  # negative-connectivity evidence the private-staging gate asks for.
  live:
    name: Live Stack Tests
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'pull_request'
    env:
      SERVICE_AUTH_TOKEN: ci-live-stack-token-not-a-real-secret
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install test tooling
        run: pip install pytest pytest-asyncio httpx

      - name: Start the stack
        run: docker compose -f infra/docker/docker-compose.yml up -d --build --wait

      - name: Health check
        run: ./scripts/health_check.sh

      - name: Run live stack tests
        env:
          SMARTBANK_INTEGRATION_BASE_URL: http://localhost:8001
        run: pytest tests/integration -q -m live

      - name: Service logs on failure
        if: failure()
        run: docker compose -f infra/docker/docker-compose.yml logs --tail 200

      - name: Tear down
        if: always()
        run: docker compose -f infra/docker/docker-compose.yml down -v

  # ── 4. Deploy ───────────────────────────────────────────────────────────────
  # Both environments must carry GitHub environment protection rules with
  # required reviewers. The workflow deliberately encodes no automatic promotion.
  deploy:
    name: Deploy to ${{ inputs.deploy_environment }}
    runs-on: ubuntu-latest
    needs: [build, live]
    if: github.event_name == 'workflow_dispatch'
    environment: ${{ inputs.deploy_environment }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Configure kubectl
        uses: azure/k8s-set-context@ae59a723ba9abe7a9655538854a025448dbab4aa # v4.0.2
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBE_CONFIG }}

      - name: Pin image tags to this commit
        run: |
          cd "infra/k8s/overlays/${{ inputs.deploy_environment }}"
          kustomize edit set image \
            "orchestrator=${REGISTRY}/${IMAGE_PREFIX}-orchestrator:${GITHUB_SHA}"

      - name: Apply
        run: kubectl apply -k "infra/k8s/overlays/${{ inputs.deploy_environment }}"

      - name: Wait for rollout
        run: |
          for svc in orchestrator fraud-detection credit-risk aml-compliance \
                     personalization predictive-analytics conversational-ai \
                     smart-dashboard data-aggregation; do
            kubectl rollout status "deployment/$svc" --timeout=10m
          done
